name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Check secrets
        env:
          URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          HOST: ${{ secrets.FTP_HOST }}
          SITE: ${{ secrets.FTP_SITE_DIR }}
          ADMIN: ${{ secrets.FTP_ADMIN_DIR }}
        run: |
          for v in URL KEY HOST SITE ADMIN; do [ -n "${!v}" ] || { echo "::error::Missing GitHub secret for $v (see README → Auto-deploy)"; exit 1; }; done
          case "$SITE$ADMIN" in *public_html/*public_html/) ;; *) echo "::error::FTP_SITE_DIR and FTP_ADMIN_DIR must both end in public_html/"; exit 1;; esac
      - name: Check FTP folders
        # Both targets must already hold a live index.html, so a wrong path can never scatter files around the server.
        env:
          HOST: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASSWORD }}
          SITE: ${{ secrets.FTP_SITE_DIR }}
          ADMIN: ${{ secrets.FTP_ADMIN_DIR }}
        run: |
          ls_ftp() { curl -sS --ssl-reqd --list-only --max-time 30 --user "$U:$P" "ftp://$HOST$1"; }
          ok=1
          for d in "$SITE" "$ADMIN"; do
            if ls_ftp "$d" | tr -d '\r' | grep -qx index.html; then echo "OK: $d"; else echo "::error::No index.html in $d"; ok=0; fi
          done
          if [ $ok = 0 ]; then
            echo "What this FTP account sees at / :"; ls_ftp / || true
            for sub in www public_html bradygrouphomes.com admin.bradygrouphomes.com; do echo "--- /$sub/"; ls_ftp "/$sub/" || true; done
            exit 1
          fi
      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload main site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SITE_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            admin/**

      - name: Upload admin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/admin/
          server-dir: ${{ secrets.FTP_ADMIN_DIR }}
          state-name: .ftp-deploy-admin.json
